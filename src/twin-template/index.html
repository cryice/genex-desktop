<!doctype html>
<meta charset="utf-8" />
<title>__PARK_TITLE__</title>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0e14;
    color: #cfd6e4;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #view {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    touch-action: none;
  }
  #fatal {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    padding: 24px;
    background: #10060a;
    color: #ffb4b4;
    font-family: ui-monospace, SFMono-Regular, monospace;
    white-space: pre-wrap;
  }
</style>
<!-- A twin that throws on load must still be diagnosable, so failures are rendered into the
     page and pushed into the studio contract instead of vanishing into a console. -->
<pre id="fatal"></pre>

<!-- Babylon is vendored with the studio: a park builds and runs with no network at all.
     The UMD build exposes one BABYLON global, which src/main.js reads; there is no import map
     for it, so the studio's injected map (three keys) never collides with it. -->
<script src="/vendor/babylon.js"></script>
<script type="module">
  window.addEventListener("error", (event) => {
    const box = document.getElementById("fatal");
    box.style.display = "grid";
    box.textContent = `${event.message}\n\n${event.error?.stack ?? ""}`;
    window.__studio_error = { message: event.message, stack: event.error?.stack ?? "" };
  });
</script>
<script type="module" src="/src/main.js"></script>
